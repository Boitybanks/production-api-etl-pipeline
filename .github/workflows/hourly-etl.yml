name: On-demand cryptocurrency ETL

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-crypto-etl
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check database configuration
        run: |
          test -n "$DB_HOST" || { echo "Configure DB_HOST secret"; exit 1; }
          test -n "$DB_PASSWORD" || { echo "Configure DB_PASSWORD secret"; exit 1; }
      - name: Prepare log directory
        run: mkdir -p logs
      - name: Ingest requested snapshot
        run: python src/pipeline.py
