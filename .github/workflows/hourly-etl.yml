name: Hourly cryptocurrency ETL

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hourly-crypto-etl
  cancel-in-progress: false

jobs:
  ingest:
    # Scheduled runs stay skipped until the ETL_SCHEDULE_ENABLED repository
    # variable is 'true', so an unconfigured database cannot fail every hour.
    if: github.event_name != 'schedule' || vars.ETL_SCHEDULE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check database configuration
        run: |
          if [ -z "$DATABASE_URL" ] && { [ -z "$DB_HOST" ] || [ -z "$DB_PASSWORD" ]; }; then
            echo "::error::Configure the DATABASE_URL secret, or both DB_HOST and DB_PASSWORD secrets."
            exit 1
          fi
      - name: Apply database schema
        run: python src/init_db.py
      - name: Ingest hourly snapshot
        run: python src/pipeline.py
